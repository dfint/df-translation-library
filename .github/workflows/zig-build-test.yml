name: zig build test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.zig'
      - '**/build.zig.zon'
      - 'test_data/**'
      - '.github/**.yml'

  pull_request:
    branches: [ "main" ]
    paths:
      - '**.zig'
      - '**/build.zig.zon'
      - 'test_data/**'
      - '.github/**.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig-version:
          - "0.17.1"
          # - "master"

    name: Build and Test
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Check formatting
        run: zig fmt --check .

      - name: Install and run zlint
        run: |
          curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.10.0/zlint-linux-x86_64 > zlint
          chmod +x zlint
          ./zlint --deny-warnings

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install --yes kcov

      - name: Run tests and collect coverage
        run: zig build test-coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: zig-out/coverage/coverage-test/cobertura.xml
          format: cobertura

      - name: Build cli
        run: cd cli && zig build
